schema_version: coi-source-fact-mapping.v1
contract_version: 1.0.0
initiative_id: INIT-ACC-001
milestone: S8-M2
mapping_policy:
  read_only: true
  semantic_inference: prohibited
  missing_token_policy: explicit
  authority_escalation: prohibited
  consumer_authority: DERIVED_NON_AUTHORITATIVE
  row_identity_policy: source_primary_key_only
  notes:
    - A mapping may normalize representation but must not infer a business fact that is not explicit in the governed source.
    - Source tokens such as '-' or blank never become numeric zero.
    - UNKNOWN carries no value; SOURCE_NOT_EVIDENCED is preserved in limitations.
    - Source-level authority and freshness are copied into every projected fact.

sources:
  - source_id: RM-FUND-001
    concern_family: FH-CF-01
    provider: GOOGLE_SHEETS
    spreadsheet_id: 1E3JKkTa2BZzSCmttxYxq4vSlYjn21gMWoRuYeJSO44Y
    sheet: Dashboard
    source_title: 03 - Funding Activation Portfolio & Dashboard — ADÜMÜN
    authority_mode: DERIVED_NON_AUTHORITATIVE
    authority_owner: Finance + Strategy & Portfolio
    freshness_registry_ref: REG-RM-001:RM-FUND-001
    selector_mode: LABEL_VALUE
    row_identity: Dashboard singleton
    mappings:
      - canonical_concept: FUNDING_OPERATING_MINIMUM_MONTHLY
        display_label: Consolidated operating minimum
        match_column: A
        match_value: WHAT — Consolidated Operating Minimum (CLP/mo)
        value_column: B
        interpretation_column: C
        semantic_class: TARGET
        unit: CLP_PER_MONTH
        transform: PARSE_INTEGER_FORMATTED_NUMBER
        missing_tokens: ['-', '']
        missing_value_state: UNKNOWN
        missing_limitation: SOURCE_NOT_EVIDENCED
      - canonical_concept: FUNDING_PREDICTABLE_MONTHLY_COVERAGE
        display_label: Predictable monthly coverage
        match_column: A
        match_value: Predictable coverage (CLP/mo)
        value_column: B
        interpretation_column: C
        semantic_class: PREDICTABLE_COVERAGE
        unit: CLP_PER_MONTH
        transform: PARSE_INTEGER_FORMATTED_NUMBER
        missing_tokens: ['-', '']
        missing_value_state: UNKNOWN
        missing_limitation: SOURCE_NOT_EVIDENCED
      - canonical_concept: FUNDING_COVERAGE_GAP_MONTHLY
        display_label: Monthly coverage gap
        match_column: A
        match_value: Coverage gap (CLP/mo)
        value_column: B
        interpretation_column: C
        semantic_class: DERIVED_ATTENTION
        unit: CLP_PER_MONTH
        transform: PARSE_INTEGER_FORMATTED_NUMBER
        missing_tokens: ['-', '']
        missing_value_state: UNKNOWN
        missing_limitation: SOURCE_NOT_EVIDENCED
      - canonical_concept: FUNDING_COLLECTED_CASH_MTD
        display_label: Collected cash month-to-date
        match_column: A
        match_value: Collected cash MTD (CLP)
        value_column: B
        interpretation_column: C
        semantic_class: COLLECTED_CASH
        unit: CLP
        transform: PARSE_INTEGER_FORMATTED_NUMBER
        missing_tokens: ['-', '']
        missing_value_state: UNKNOWN
        missing_limitation: SOURCE_NOT_EVIDENCED

