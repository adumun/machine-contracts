schema_version: coi-vocabulary.v1
contract_version: 1.0.0
normative_sources:
  - 36 - S5 Product-Service Discovery — Corporate Operating Intelligence v0.1
  - 39 - S6 Solution & Feasibility Assessment — Corporate Operating Intelligence v0.1
  - 41 - S7 Initiative Readiness & First-Horizon Delivery Plan — Corporate Operating Intelligence v0.1
  - 42 - G7 Gate Decision & S8 Delivery Entry — Corporate Operating Intelligence v0.1
  - 43 - Pre-S8 Canonical Reconciliation — Corporate Operating Intelligence v0.1
concern_families:
  FH-CF-01: Funding / Finance boundary
  FH-CF-02: Initiative Lifecycle / Portfolio state
  FH-CF-03: Enterprise Decisions / authority status
  FH-CF-04: Structural Ownership / organizational responsibility
  FH-CF-05: Source Health / freshness / reconciliation state
value_states:
  - KNOWN
  - UNKNOWN
  - MISSING
  - STALE
  - RECONCILIATION_REQUIRED
  - RESTRICTED
  - NOT_APPLICABLE
authority_modes:
  - SOURCE_AUTHORITY
  - REGISTRY_AUTHORITY
  - DERIVED_NON_AUTHORITATIVE
  - OBSERVATION
  - ESTIMATE
  - ASSUMPTION
freshness_states:
  - CURRENT
  - STALE
  - UNKNOWN
  - REVIEW_REQUIRED
confidentiality_classes:
  - PUBLIC
  - INTERNAL
  - RESTRICTED
  - LEGAL_CONFIDENTIAL
  - PEOPLE_CONFIDENTIAL
semantic_classes:
  TARGET: Desired or required future/threshold value; never actual.
  ACTUAL: Observed authoritative actual value.
  FORECAST: Forward-looking modeled expectation.
  ESTIMATE: Non-authoritative bounded estimate.
  PIPELINE: Potential commercial value not equivalent to booked, billed, recognized or collected value.
  BOOKED_COMMITTED: Governed commercial commitment distinct from billed, collected or recognized value.
  BILLED: Invoiced/billed value distinct from collected cash or recognized revenue.
  COLLECTED_CASH: Cash actually collected under Finance/Treasury authority.
  RECOGNIZED_REVENUE: Revenue recognized under applicable accounting authority.
  LIFECYCLE_STATE: Canonical initiative lifecycle state.
  GATE_STATE: Canonical lifecycle gate and outcome state.
  DECISION_STATUS: Governed decision lifecycle/status.
  AUTHORITY_STATUS: Authority mode/status of a governed record.
  STRUCTURAL_OWNERSHIP: Organizational accountability/ownership relation.
  SOURCE_HEALTH: Availability, freshness or integrity state of a governed source/read model.
  DERIVED_ATTENTION: Non-authoritative derived attention signal computed from governed inputs.
